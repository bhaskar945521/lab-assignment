<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab Details | Node.js Portfolio</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span>Node</span><b>.js</b> Lab</a><a href="index.html">← Back to Portfolio</a></header><main class="section" id="detail"><div class="loading">Loading lab...</div></main><script>
const folder=new URLSearchParams(location.search).get('lab');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){if(!folder){location.href='index.html';return}const r=await fetch(`${folder}/lab.json`);if(!r.ok)throw Error();const l=await r.json();
const tech=(l.technologies||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
const steps=(l.steps||[]).map((x,i)=>`<li><b>${i+1}.</b> ${esc(x)}</li>`).join('');
const files=(l.files||[]).map(x=>`<a class="file-link" href="${encodeURI(folder+'/'+x)}" target="_blank">${esc(x)}</a>`).join('');
const shots=(l.screenshots||[]).map(x=>`<figure><img src="${encodeURI(folder+'/'+x)}" alt="${esc(x)}" onerror="this.parentElement.style.display='none'"><figcaption>${esc(x)}</figcaption></figure>`).join('');
document.getElementById('detail').innerHTML=`<p class="eyebrow">LAB ${String(l.labNo).padStart(2,'0')}</p><h1>${esc(l.title)}</h1><p class="hero-text">${esc(l.description)}</p><div class="chips">${tech}</div><div class="detail-grid"><section class="detail-card"><h2>Objective</h2><p>${esc(l.objective)}</p><h2>Theory</h2><p>${esc(l.theory)}</p><h2>Procedure</h2><ol>${steps}</ol></section><section class="detail-card"><h2>Files</h2><div class="files">${files||'<span class="muted">No files listed.</span>'}</div></section></div>${shots?`<section class="detail-card"><h2>Output & Screenshots</h2><div class="shots">${shots}</div></section>`:''}`}
load().catch(()=>document.getElementById('detail').innerHTML='<div class="loading">Lab details not found. Make sure the lab folder contains lab.json.</div>');
</script><style>.detail-grid{display:grid;grid-template-columns:1fr 340px;gap:18px;margin-top:35px}.detail-card{background:linear-gradient(145deg,#151821,#101218);border:1px solid var(--line);border-radius:18px;padding:25px;margin-top:18px}.detail-card h2{font-size:20px;margin-top:0}.detail-card p,.detail-card li{color:var(--muted);line-height:1.8}.detail-card ol{padding-left:24px}.files{display:flex;flex-direction:column;gap:10px}.file-link{color:#a99dff;background:#1a1d27;border:1px solid var(--line);padding:10px 12px;border-radius:9px;font-size:13px}.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.shots figure{margin:0;background:#0c0e13;border-radius:12px;overflow:hidden;border:1px solid var(--line)}.shots img{display:block;width:100%;height:190px;object-fit:cover}.shots figcaption{padding:9px;color:var(--muted);font-size:11px}@media(max-width:800px){.detail-grid,.shots{grid-template-columns:1fr}.shots img{height:auto}}
</style></body></html>
